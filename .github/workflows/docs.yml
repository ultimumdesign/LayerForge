name: Publish manual

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - USER_GUIDE.md
      - CONTRIBUTING.md
      - RELEASING.md
      - docs/**
      - scripts/build-docs.mjs
      - .github/workflows/docs.yml
  pull_request:
    branches:
      - main
    paths:
      - README.md
      - USER_GUIDE.md
      - CONTRIBUTING.md
      - RELEASING.md
      - docs/**
      - scripts/build-docs.mjs
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build manual
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install Markdown renderer
        run: npm install --no-save --no-package-lock --ignore-scripts marked@15.0.12

      - name: Build HTML manual
        run: node scripts/build-docs.mjs build/docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/docs

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Requires Settings > Pages > Source set to "GitHub Actions".
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
