name: Build plug-in releases

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Audit locked dependencies
        run: npm audit --audit-level=high

      - name: Verify release metadata
        run: npm run check:release

      - name: Validate Conventional Commit pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" | npx commitlint
          npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA"

      - name: Validate pushed Conventional Commits
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            npx commitlint --last
          else
            npx commitlint --from "$BEFORE_SHA" --to "$GITHUB_SHA"
          fi

      - name: Lint JavaScript and JSX
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Install shell and C++ lint tools
        run: sudo apt-get update && sudo apt-get install --yes shellcheck clang-format

      - name: Lint shell scripts
        run: npm run lint:shell

      - name: Check native C++ formatting
        run: npm run lint:native

  javascript-security:
    name: CodeQL JavaScript analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: javascript-typescript

      - name: Analyze JavaScript
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4

  build:
    name: Build ${{ matrix.platform }} VST3
    needs: [quality, javascript-security]
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS universal
            runner: macos-15-intel
            asset: LayerForge-macos-universal-vst3.zip
          - platform: Windows x64
            runner: windows-2022
            asset: LayerForge-windows-x64-vst3.zip

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Build embedded UI
        run: npm run build:ui

      - name: Fetch native build dependencies
        shell: bash
        run: |
          mkdir -p native/third_party
          git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git native/third_party/JUCE
          git clone https://github.com/elemaudio/elementary.git native/third_party/elementary
          git -C native/third_party/elementary checkout 60e72342d92d18d174d9e20421f0d8070ab05b2a
          git -C native/third_party/elementary submodule update --init --recursive

      - name: Install WebView2 build SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packages = "$env:USERPROFILE\AppData\Local\PackageManagement\NuGet\Packages"
          nuget install Microsoft.Web.WebView2 -Version 1.0.1901.177 -OutputDirectory $packages -NonInteractive

      - name: Remove stale native build cache
        shell: bash
        run: rm -rf native/build

      - name: Initialize native CodeQL
        if: runner.os == 'macOS'
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: c-cpp
          build-mode: manual

      - name: Configure native plug-in
        run: cmake -B native/build -S native -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build native/build --config Release --target LayerForge_VST3 --parallel 3

      - name: Analyze native C++
        if: runner.os == 'macOS'
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4

      - name: Package macOS VST3
        if: runner.os == 'macOS'
        shell: bash
        run: |
          plugin="native/build/LayerForge_artefacts/Release/VST3/LayerForge.vst3"
          test -d "$plugin"
          codesign --force --deep --sign - "$plugin"
          codesign --verify --deep --strict "$plugin"
          lipo "$plugin/Contents/MacOS/LayerForge" -verify_arch arm64 x86_64
          expected_version=$(node -p "require('./package.json').version")
          actual_version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$plugin/Contents/Info.plist")
          test "$actual_version" = "$expected_version"
          ditto -c -k --sequesterRsrc --keepParent "$plugin" "${{ matrix.asset }}"
          unzip -t "${{ matrix.asset }}"

      - name: Package Windows VST3
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $plugin = "native/build/LayerForge_artefacts/Release/VST3/LayerForge.vst3"
          if (!(Test-Path $plugin -PathType Container)) {
            throw "VST3 bundle was not found at $plugin"
          }
          $binary = Join-Path $plugin "Contents/x86_64-win/LayerForge.vst3"
          if (!(Test-Path $binary -PathType Leaf) -or (Get-Item $binary).Length -eq 0) {
            throw "Windows x64 VST3 binary is missing or empty"
          }
          Compress-Archive -Path $plugin -DestinationPath "${{ matrix.asset }}" -CompressionLevel Optimal -Force
          $archive = [System.IO.Compression.ZipFile]::OpenRead("${{ matrix.asset }}")
          try {
            $entry = $archive.GetEntry("LayerForge.vst3/Contents/x86_64-win/LayerForge.vst3")
            if ($null -eq $entry -or $entry.Length -eq 0) {
              throw "Windows VST3 ZIP does not contain its plug-in binary"
            }
          } finally {
            $archive.Dispose()
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Create draft release and upload VST3s
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download successful platform builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: LayerForge-*-vst3.zip
          path: release-assets
          merge-multiple: true

      - name: Create or update version PR and release
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Verify release matches the built commit
        if: steps.release.outputs.tag_name != ''
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tag_commit=$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")
          if [ "$tag_commit" != "$GITHUB_SHA" ]; then
            echo "::error::Release tag points to $tag_commit, not the built commit $GITHUB_SHA"
            exit 1
          fi
          test -f release-assets/LayerForge-macos-universal-vst3.zip
          test -f release-assets/LayerForge-windows-x64-vst3.zip

      - name: Upload VST3 downloads to draft GitHub Release
        if: steps.release.outputs.tag_name != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            release-assets/LayerForge-macos-universal-vst3.zip \
            release-assets/LayerForge-windows-x64-vst3.zip --clobber
